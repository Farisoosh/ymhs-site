<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youth Mental Health Symposium</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Poppins:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2343AF;
    --navy-dark:#233E8D;
    --bg-white:#FFFFFF;
    --bg-tint:#EEF2FD;
    --card-tint:#F1F5FE;
    --gray-label:#78849A;
    --gray-text:#65696F;
    --border:#E5E9F5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--navy-dark);
    background:linear-gradient(135deg, var(--bg-tint) 0%, #FFFFFF 60%);
    overflow-x:hidden;
  }
  .serif{font-family:'Playfair Display',serif; font-style:italic; font-weight:600;}
  a{text-decoration:none;color:inherit;}
  .container{max-width:1200px;margin:0 auto;padding:0 24px;}

  /* NAV */
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:24px 24px;max-width:1200px;margin:0 auto;
    border-bottom:1px solid var(--border);
  }
  .logo{font-weight:800;font-size:22px;color:var(--navy-dark);}
  .nav-links{display:flex;gap:32px;list-style:none;}
  .nav-links a{color:var(--gray-text);font-size:15px;font-weight:500;}
  .nav-links a:hover{color:var(--navy);}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--navy);color:#fff;
    padding:12px 24px;border-radius:999px;
    font-weight:600;font-size:15px;border:none;cursor:pointer;
  }
  .menu-toggle{display:none;background:none;border:none;font-size:26px;color:var(--navy-dark);cursor:pointer;}
  .lang-toggle{
    display:inline-flex;align-items:center;gap:2px;background:var(--bg-tint);
    border:1px solid var(--border);border-radius:999px;padding:4px;font-size:12px;font-weight:700;
  }
  .lang-toggle button{
    border:none;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;
    color:var(--gray-text);font-weight:700;font-size:12px;letter-spacing:0.5px;
    font-family:'Poppins','Tajawal',sans-serif;
  }
  .lang-toggle button.active{background:var(--navy);color:#fff;}
  .lang-toggle-row{display:none;padding:14px 0;border-top:1px solid var(--border);}

  /* HERO */
  .hero{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;
    max-width:1200px;margin:0 auto;padding:60px 24px 80px;align-items:center;
  }
  .eyebrow{
    letter-spacing:3px;font-size:13px;color:var(--gray-label);
    font-weight:600;margin-bottom:16px;
  }
  h1.headline{font-size:56px;line-height:1.05;font-weight:800;color:var(--navy-dark);}
  .meta-row{display:flex;gap:24px;margin:24px 0;color:var(--gray-text);font-size:15px;flex-wrap:wrap;}
  .meta-row span{display:flex;align-items:center;gap:6px;}
  .meta-row a:hover{text-decoration:underline;}
  .countdown{margin-top:48px;}
  .countdown-label{font-size:13px;letter-spacing:2px;color:var(--gray-label);font-weight:600;margin-bottom:12px;}
  .countdown-grid{display:flex;gap:32px;}
  .countdown-grid div{text-align:center;}
  .countdown-grid .num{font-size:40px;font-weight:800;color:var(--navy-dark);}
  .countdown-grid .lbl{font-size:11px;letter-spacing:1px;color:var(--gray-label);}

  .hero-photo-wrap{max-width:440px;margin-left:auto;perspective:1200px;}
  .hero-photo{
    position:relative;border-radius:20px;overflow:hidden;
    box-shadow:0 20px 50px rgba(35,67,175,0.15);
    border:4px solid #fff;
    aspect-ratio:4/5;
    transform:rotate(-3deg);
    transition:transform .5s cubic-bezier(.22,1,.36,1), box-shadow .5s ease;
    will-change:transform;
  }
  .hero-photo.is-hovering{
    transition:transform .08s linear, box-shadow .3s ease;
    box-shadow:0 30px 60px rgba(35,67,175,0.28);
  }
  .hero-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  .hero-photo.is-hovering img{transform:scale(1.06);}

  /* SECTIONS shared */
  section{padding:90px 24px;max-width:1200px;margin:0 auto;}
  .section-label{display:flex;gap:12px;align-items:center;font-size:13px;letter-spacing:2px;color:var(--gray-label);font-weight:600;margin-bottom:24px;}
  .section-label .num{color:var(--navy);font-weight:700;}
  h2.section-title{font-size:42px;font-weight:800;margin-bottom:24px;}
  h2.section-title .serif{font-size:46px;display:block;}

  /* MANIFESTO */
  .manifesto-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-top:48px;}
  .manifesto-cards .card{padding:40px;border-left:1px solid var(--border);}
  .manifesto-cards .card:first-child{border-left:none;}
  .card .card-num{font-size:36px;font-weight:800;color:var(--border);margin-bottom:16px;}
  .card h3{font-size:22px;margin-bottom:12px;}
  .card p{font-size:15px;color:var(--gray-text);line-height:1.6;}

  /* COMMITTEES */
  .committees-wrap{display:grid;grid-template-columns:0.85fr 1.15fr;gap:60px;align-items:start;}
  .committees-wrap p.body{color:var(--gray-text);line-height:1.7;margin:20px 0;}
  .pick-link{font-size:13px;letter-spacing:1px;font-weight:600;color:var(--navy-dark);}
  .tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
  .tab{
    padding:10px 20px;border-radius:999px;border:1px solid var(--border);
    font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--gray-text);
  }
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .committee-card{border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .committee-head{
    background:var(--card-tint);padding:24px 28px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .committee-head .chaired-label{font-size:12px;letter-spacing:1px;color:var(--gray-label);font-weight:600;}
  .committee-head .names{font-size:17px;font-weight:700;margin-top:4px;}
  .committee-head .big-num{font-size:40px;font-weight:800;color:#dbe3f7;}
  .topic-row{display:flex;gap:16px;padding:18px 28px;border-top:1px solid var(--border);font-size:15px;color:var(--navy-dark);font-weight:600;}
  .topic-row .n{color:var(--navy-dark);font-weight:700;min-width:20px;}

  /* SCHEDULE */
  .schedule-sub{text-align:center;}
  .schedule-sub h2{font-size:34px;}
  .schedule-sub h2.section-title .serif{color:var(--gray-text);font-size:17px;font-weight:400;display:block;margin-top:12px;font-style:italic;}

  .schedule-timeline{
    margin:48px auto 0;max-width:640px;text-align:left;
    background:#fff;border-radius:24px;overflow:hidden;
    box-shadow:0 20px 50px rgba(28,58,94,0.15);border:1px solid var(--border);
  }
  .sched-row{
    display:flex;align-items:center;gap:20px;padding:18px 28px;
    border-top:1px solid var(--border);
  }
  .sched-row:first-child{border-top:none;}
  .sched-row.is-break{background:var(--bg-tint);}
  .sched-time{
    font-weight:800;font-size:14px;color:var(--navy);min-width:118px;flex-shrink:0;
    font-variant-numeric:tabular-nums;
    direction:ltr;unicode-bidi:isolate;text-align:left;
  }
  .sched-label{font-weight:600;font-size:15px;color:var(--navy-dark);}
  .sched-row.is-break .sched-label{color:var(--gray-text);font-weight:500;}

  /* GALLERY */
  .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px;}
  .gallery-grid > div{
    border-radius:16px;overflow:hidden;position:relative;aspect-ratio:3/2;
    box-shadow:0 0 0 rgba(28,58,94,0);
    transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s ease;
  }
  .gallery-grid > div:nth-child(odd):hover{transform:translateY(-6px) rotate(-0.6deg);}
  .gallery-grid > div:nth-child(even):hover{transform:translateY(-6px) rotate(0.6deg);}
  .gallery-grid > div:hover{box-shadow:0 22px 40px rgba(28,58,94,0.22);}
  .gallery-grid img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  .gallery-grid > div:hover img{transform:scale(1.09);}
  @media(max-width:640px){
    .gallery-grid{grid-template-columns:1fr;}
  }

  /* TEAM */
  .team-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:48px;
    max-width:600px;margin:48px auto 0;
  }
  .team-card{text-align:center;}
  .team-photo{
    aspect-ratio:4/5;border-radius:20px;overflow:hidden;position:relative;
    margin-bottom:20px;box-shadow:0 16px 40px rgba(28,58,94,0.18);
    transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s ease;
  }
  .team-photo:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(28,58,94,0.25);}
  .team-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .team-photo.placeholder{
    background:repeating-linear-gradient(45deg,#dfe6fa,#dfe6fa 10px,#eef2fd 10px,#eef2fd 20px);
    display:flex;align-items:center;justify-content:center;
    color:var(--navy);font-size:56px;font-weight:800;
    font-family:'Playfair Display',serif;letter-spacing:2px;
  }
  .team-name{font-size:20px;font-weight:800;color:var(--navy-dark);margin-bottom:4px;}
  .team-role{font-size:12px;letter-spacing:1.5px;color:var(--gray-label);font-weight:600;text-transform:uppercase;}
  @media(max-width:640px){
    .team-grid{grid-template-columns:1fr;max-width:280px;}
  }

  /* CLOSING CTA */
  .closing{
    text-align:center;background:var(--card-tint);border-radius:28px;
    max-width:1152px;margin:0 auto 40px;padding:80px 24px;
  }
  .closing h2{font-size:44px;font-weight:800;line-height:1.15;}
  .closing h2 .serif{font-size:48px;display:block;}
  .closing p{color:var(--gray-text);margin:20px auto 32px;max-width:480px;font-size:16px;}

  footer{
    border-top:1px solid var(--border);padding:40px 24px;text-align:center;
    color:var(--gray-label);font-size:13px;
  }
  .footer-social{
    display:flex;justify-content:center;gap:20px;margin-bottom:16px;
  }
  .footer-social a{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--navy-dark);font-weight:600;font-size:14px;
    transition:color .2s ease;
  }
  .footer-social a:hover{color:var(--navy);}

  .menu-toggle{
    display:none;background:none;border:none;font-size:26px;
    color:var(--navy-dark);cursor:pointer;line-height:1;
  }

  /* REGISTER */
  #register{max-width:1200px;margin:0 auto;padding:60px 24px 100px;}
  .register-card{
    background:var(--card-tint);border-radius:28px;
    padding:56px;max-width:760px;margin:0 auto;
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:13px;font-weight:600;color:var(--navy-dark);}
  .field .hint{font-size:12px;color:var(--gray-label);font-weight:400;}
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="tel"],
  .field select,
  .field textarea{
    font-family:'Poppins',sans-serif;
    border:1px solid var(--border);border-radius:12px;
    padding:13px 16px;font-size:15px;color:var(--navy-dark);
    background:#fff;width:100%;
  }
  .field textarea{resize:vertical;min-height:90px;line-height:1.5;}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--navy);
  }
  .field .file-input{
    border:1px dashed var(--border);border-radius:12px;padding:16px;
    background:#fff;font-size:14px;color:var(--gray-text);cursor:pointer;
  }
  .radio-row{display:flex;gap:20px;flex-wrap:wrap;padding-top:4px;}
  .radio-row label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--navy-dark);}
  #register-submit{margin-top:28px;width:100%;justify-content:center;font-size:16px;padding:15px 24px;}
  #register-submit:disabled{opacity:.6;cursor:not-allowed;}
  .form-status{margin-top:16px;font-size:14px;text-align:center;}
  .form-status.success{color:#1c7c3f;}
  .form-status.error{color:#C0392B;}

  @media(max-width:820px){
    nav{position:relative;flex-wrap:wrap;}
    nav .nav-links{
      display:none;width:100%;flex-direction:column;gap:0;
      order:3;margin-top:20px;
    }
    nav .nav-links.open{display:flex;}
    nav .nav-links a{padding:14px 0;border-top:1px solid var(--border);}
    .menu-toggle{display:block;}
    .hero{grid-template-columns:1fr;}
    h1.headline{font-size:38px;}
    .hero-photo-wrap{margin:40px auto 0;}
    .manifesto-cards{grid-template-columns:1fr;}
    .manifesto-cards .card{border-left:none;border-top:1px solid var(--border);}
    .manifesto-cards .card:first-child{border-top:none;}
    .committees-wrap{grid-template-columns:1fr;}
    .countdown-grid{gap:20px;}
    .register-card{padding:32px 24px;}
    .form-grid{grid-template-columns:1fr;}
    .lang-toggle{display:none;}
    .lang-toggle-row{display:flex;}
  }

  /* ARABIC / RTL */
  html[dir="rtl"] body{font-family:'Tajawal',sans-serif;}
  html[dir="rtl"] .serif{font-family:'Tajawal',sans-serif;font-style:normal;font-weight:800;}
  html[dir="rtl"] .nav-links{flex-direction:row-reverse;}
  html[dir="rtl"] .hero-photo-wrap{margin-left:0;margin-right:auto;}
  html[dir="rtl"] .manifesto-cards .card{border-left:none;border-right:1px solid var(--border);}
  html[dir="rtl"] .manifesto-cards .card:first-child{border-right:none;}
  html[dir="rtl"] .meta-row,
  html[dir="rtl"] .footer-social,
  html[dir="rtl"] .radio-row,
  html[dir="rtl"] .tabs{flex-direction:row-reverse;}
  html[dir="rtl"] .committee-head{flex-direction:row-reverse;}
  html[dir="rtl"] .topic-row{flex-direction:row-reverse;justify-content:flex-end;}
  html[dir="rtl"] .sched-row{flex-direction:row-reverse;}
  html[dir="rtl"] .field label,
  html[dir="rtl"] .field .hint{text-align:right;}
  html[dir="rtl"] .countdown-grid{flex-direction:row-reverse;}
  @media(max-width:820px){
    html[dir="rtl"] .nav-links a{border-top:1px solid var(--border);}
  }
</style>
</head>
<body>

<nav>
  <div class="logo">YMHS</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="#about" data-i18n="About|نبذة"></a></li>
    <li><a href="#committees" data-i18n="Committees|اللجان"></a></li>
    <li><a href="#schedule" data-i18n="Schedule|الجدول"></a></li>
    <li><a href="#gallery" data-i18n="Gallery|الصور"></a></li>
    <li><a href="#register" data-i18n="Register|التسجيل"></a></li>
    <li class="lang-toggle-row">
      <div class="lang-toggle" id="langToggleMobile">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ar">عربي</button>
      </div>
    </li>
  </ul>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="lang-toggle" id="langToggleDesktop">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ar">عربي</button>
    </div>
    <a class="btn" href="#register" data-i18n="Register|التسجيل"></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
  </div>
</nav>

<div class="hero">
  <div>
    <div class="eyebrow" data-i18n="THE 2ND EDITION|النسخة الثانية"></div>
    <h1 class="headline" data-i18n="Youth Mental Health Symposium|ملتقى الصحة النفسية للشباب"></h1>
    <div class="meta-row">
      <span>📅 <span data-i18n="November 21, 2026|21 نوفمبر 2026"></span></span>
      <span>🕙 <bdi style="unicode-bidi:isolate;direction:ltr;">10:00 — 17:30</bdi></span>
      <span>📍 <a href="https://www.google.com/maps/place/The+English+International+School-+Baghdad/@33.2666194,44.3568563,17z/data=!3m1!4b1!4m6!3m5!1s0x1559d59b8bc42997:0x9f55a72fe0cccd32!8m2!3d33.2666194!4d44.3568563!16s%2Fg%2F11c2kbgzsq" target="_blank" rel="noopener" data-i18n="The English International School of Baghdad|المدرسة الإنجليزية الدولية في بغداد"></a></span>
    </div>
    <a class="btn" href="#register" data-i18n="Apply Now|سجّل الآن"></a>

    <div class="countdown">
      <div class="countdown-label" data-i18n="DAYS TILL EVENT|أيام حتى الحدث"></div>
      <div class="countdown-grid">
        <div><div class="num" id="cd-days">--</div><div class="lbl" data-i18n="DAYS|يوم"></div></div>
        <div><div class="num" id="cd-hours">--</div><div class="lbl" data-i18n="HOURS|ساعة"></div></div>
        <div><div class="num" id="cd-min">--</div><div class="lbl" data-i18n="MINUTES|دقيقة"></div></div>
        <div><div class="num" id="cd-sec">--</div><div class="lbl" data-i18n="SECONDS|ثانية"></div></div>
      </div>
    </div>
  </div>

  <div class="hero-photo-wrap">
    <div class="hero-photo" id="heroPhoto"><img src="hero-photo.jpg" alt="Two delegates smiling and holding up YMHS photo booth props" fetchpriority="high" decoding="async"></div>
  </div>
</div>

<section id="about">
  <div class="section-label"><span class="num">01</span> <span data-i18n="THE MANIFESTO|البيان"></span></div>
  <h2 class="section-title" data-i18n-html="Mental health isn't a topic.<br><span class='serif'>It's the room we all live in.</span>|الصحة النفسية ليست موضوعاً.<br><span class='serif'>بل الغرفة التي نعيش فيها جميعاً.</span>"></h2>
  <div class="manifesto-cards">
    <div class="card">
      <div class="card-num">01</div>
      <h3 data-i18n="Pause|توقف"></h3>
      <p data-i18n="Take one day away from school, stress, and everything going on around you. YMHS gives you the space to take a break, and focus on yourself for a little while.|خذ يوماً بعيداً عن المدرسة والضغط وكل ما يحيط بك. يمنحك YMHS مساحة لأخذ استراحة والتركيز على نفسك قليلاً."></p>
    </div>
    <div class="card">
      <div class="card-num">02</div>
      <h3 data-i18n="Speak|تحدث"></h3>
      <p data-i18n="Six committees, each discussing different topics that affect the young people of Iraq. You get to talk, share your opinions, hear other perspectives, and discuss things that we normally don't talk about enough.|ست لجان، تناقش كل منها مواضيع مختلفة تمس شباب العراق. ستتحدث، وتشارك آراءك، وتسمع وجهات نظر أخرى، وتناقش أموراً لا نتحدث عنها عادة بما فيه الكفاية."></p>
    </div>
    <div class="card">
      <div class="card-num">03</div>
      <h3 data-i18n="Heal|اشفِ"></h3>
      <p data-i18n="Sometimes just talking about something makes it easier to understand. YMHS is a space to have those conversations, hear other people's experiences, and leave knowing a little more about yourself and the people around you.|أحياناً مجرد الحديث عن شيء ما يجعل فهمه أسهل. YMHS مساحة لإجراء هذه الأحاديث، وسماع تجارب الآخرين، والخروج بمعرفة أكبر قليلاً عن نفسك ومن حولك."></p>
    </div>
  </div>
</section>

<section id="committees">
  <div class="committees-wrap">
    <div>
      <div class="section-label"><span class="num">02</span> <span data-i18n="WHAT IS A COMMITTEE|ما هي اللجنة"></span></div>
      <h2 class="section-title serif" style="font-size:44px;" data-i18n="Six rooms.|ست غرف."></h2>
      <p class="body" data-i18n="Each committee is a small group led by two chairs, built around one topic and five questions we don't usually get the chance to talk about. You pick the room that speaks to you and sit with people going through the same things. No expertise needed, just show up and talk.|كل لجنة مجموعة صغيرة يقودها رئيسان، مبنية حول موضوع واحد وأسئلة لا نحصل عادة على فرصة الحديث عنها. تختار الغرفة التي تهمك وتجلس مع أشخاص يمرون بنفس التجارب. لا حاجة لخبرة، فقط احضر وتحدث."></p>

<script>
  // Countdown to event
  const eventDate = new Date("2026-11-21T10:00:00");
  function tick(){
    const now = new Date();
    let diff = eventDate - now;
    if(diff < 0) diff = 0;
    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff / (1000*60*60)) % 24);
    const m = Math.floor((diff / (1000*60)) % 60);
    const s = Math.floor((diff / 1000) % 60);
    document.getElementById('cd-days').textContent = d;
    document.getElementById('cd-hours').textContent = h.toString().padStart(2,'0');
    document.getElementById('cd-min').textContent = m.toString().padStart(2,'0');
    document.getElementById('cd-sec').textContent = s.toString().padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);

  // Language toggle (EN / AR)
  let currentLang = localStorage.getItem('ymhsLang') || 'en';

  function applyLang(lang) {
    currentLang = lang;
    localStorage.setItem('ymhsLang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const [en, ar] = el.dataset.i18n.split('|');
      el.textContent = lang === 'ar' ? ar : en;
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const [en, ar] = el.dataset.i18nHtml.split('|');
      el.innerHTML = lang === 'ar' ? ar : en;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const [en, ar] = el.dataset.i18nPlaceholder.split('|');
      el.placeholder = lang === 'ar' ? ar : en;
    });
    document.querySelectorAll('.lang-toggle button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    const activeTab = document.querySelector('.tab.active');
    if (activeTab) renderCommittee(+activeTab.dataset.i);
    renderSchedule();
  }

  document.querySelectorAll('.lang-toggle button').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  // Committee tabs
  const committees = [
    { names: "Mustafa Othman &amp; Alzahraa Almagsoosi",
      topics: { en: ["Schizophrenia","The psychology of forgiveness","The silence after conflict","The courage to start over","Dealing with undeserved shame"],
                ar: ["الفصام","علم نفس الغفران","الصمت بعد الخلاف","شجاعة البدء من جديد","التعامل مع الخجل غير المستحق"] } },
    { names: "Nour Luay Al Asadi &amp; Razan Alfahad",
      topics: { en: ["Dissociative Identity Disorder","The science of hope","Embracing ignorance is bliss","Why meaning matters for mental health","Can music heal the mind"],
                ar: ["اضطراب الهوية الانفصامي","علم الأمل","احتضان الجهل نعمة","لماذا يهم المعنى للصحة النفسية","هل يستطيع الموسيقى أن يشفي العقل"] } },
    { names: "Dan Al Nadoos &amp; Fatimah Ali",
      topics: { en: ["Obsessive Compulsive Disorder","Why we sabotage good things","Why we are so hard on ourselves","The psychological effects of confidence","The placebo effect"],
                ar: ["اضطراب الوسواس القهري","لماذا نخرب الأشياء الجيدة","لماذا نكون قاسين جداً على أنفسنا","الآثار النفسية للثقة بالنفس","تأثير الدواء الوهمي"] } },
    { names: "Lyan &amp; Ahmed Al-Asadi",
      topics: { en: ["Bipolar Disorder","When stress shows up physically","When your environment is sick","The art of peer pressure","When success doesn't feel like success — imposter syndrome"],
                ar: ["اضطراب ثنائي القطب","عندما يظهر التوتر جسدياً","عندما تكون بيئتك مريضة","فن ضغط الأقران","عندما لا يشعر النجاح وكأنه نجاح — متلازمة المحتال"] } },
    { names: "Aminah Alsader &amp; Teeba Alkinani",
      topics: { en: ["Eating disorders — anorexia nervosa &amp; bulimia nervosa","FOMO vs JOMO","Bedtime procrastination","Brain on boredom","The addiction to distractions"],
                ar: ["اضطرابات الأكل — فقدان الشهية العصبي والشره العصبي","الخوف من تفويت الفرصة مقابل متعة تفويتها","تسويف وقت النوم","الدماغ في حالة الملل","إدمان التشتت"] } },
    { names: "Taqdees Asad &amp; Taghreed Alhabeeb",
      topics: { en: ["Learning English through the lens of psychology","Eating disorders — what they are, and where recovery begins","Sport: a luxury or a biological need?","Making peace in an imperfect home","The evolutionary psychology of jealousy"],
                ar: ["طوّر نفسك بالإنجليزية: أسرار من علم النفس تساعدك على التعلّم بشكل أفضل","اضطرابات الأكل: ما هي؟ وكيف نبدأ طريق التعافي؟","الرياضة: رفاهية أم ضرورة بيولوجية؟ تعلّم كيف تعيد الاتصال بجسمك من خلال الحركة","بيتي ليس مثالياً... فكيف أصنع فيه مساحة من السلام","علم النفس التطوري للغيرة"] } },
  ];

  function renderCommittee(i) {
    const c = committees[i];
    document.getElementById('c-names').innerHTML = c.names;
    document.getElementById('c-num').textContent = "0" + (i+1);
    const topics = c.topics[currentLang];
    document.getElementById('c-topics').innerHTML = topics.map((t, idx) =>
      `<div class="topic-row ${idx===0?'active':''}"><span class="n">0${idx+1}</span><span>${t}</span></div>`
    ).join('');
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderCommittee(+tab.dataset.i);
    });
  });

  // Schedule timeline
  const scheduleData = [
    { time: "10:00 – 10:40", label: { en: "Opening Ceremony", ar: "حفل الافتتاح" }, isBreak: false },
    { time: "10:40 – 11:40", label: { en: "Session 1", ar: "الجلسة الأولى" }, isBreak: false },
    { time: "11:40 – 12:00", label: { en: "Break", ar: "استراحة" }, isBreak: true },
    { time: "12:00 – 13:00", label: { en: "Session 2", ar: "الجلسة الثانية" }, isBreak: false },
    { time: "13:00 – 13:50", label: { en: "Lunch", ar: "الغداء" }, isBreak: true },
    { time: "13:50 – 14:50", label: { en: "Session 3", ar: "الجلسة الثالثة" }, isBreak: false },
    { time: "14:50 – 15:10", label: { en: "Break", ar: "استراحة" }, isBreak: true },
    { time: "15:10 – 16:10", label: { en: "Project Session", ar: "جلسة المشروع" }, isBreak: false },
    { time: "16:10 – 17:30", label: { en: "Closing Ceremony", ar: "حفل الختام" }, isBreak: false },
  ];

  function renderSchedule() {
    const el = document.getElementById('scheduleTimeline');
    if (!el) return;
    el.innerHTML = scheduleData.map(row =>
      `<div class="sched-row ${row.isBreak ? 'is-break' : ''}">
        <div class="sched-time">${row.time}</div>
        <div class="sched-label">${row.label[currentLang]}</div>
      </div>`
    ).join('');
  }

  // Mobile nav toggle
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');
  if (menuToggle && navLinks) {
    menuToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      menuToggle.textContent = isOpen ? '✕' : '☰';
    });
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      navLinks.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
      menuToggle.textContent = '☰';
    }));
  }

  // Hero photo cursor-tilt
  const heroPhoto = document.getElementById('heroPhoto');
  if (heroPhoto) {
    const maxTilt = 10; // degrees
    heroPhoto.addEventListener('mousemove', (e) => {
      const rect = heroPhoto.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;  // 0..1
      const y = (e.clientY - rect.top) / rect.height;  // 0..1
      const rotateY = (x - 0.5) * maxTilt * 2;   // left/right tilt
      const rotateX = (0.5 - y) * maxTilt * 2;   // up/down tilt
      heroPhoto.style.transform = `rotate(-3deg) scale(1.05) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });
    heroPhoto.addEventListener('mouseenter', () => {
      heroPhoto.classList.add('is-hovering');
    });
    heroPhoto.addEventListener('mouseleave', () => {
      heroPhoto.classList.remove('is-hovering');
      heroPhoto.style.transform = '';
    });
  }

  // Registration form
  const FORM_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzt4LrfDY_7fECDxUs6mbqB3Dd5QCrRTJJDxAb8X6nVLphBWotoMh_2CkhACxfGtcEyYw/exec';

  function resizeImageToDataUrl(file, maxDim) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const registerForm = document.getElementById('registerForm');
  if (registerForm) {
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('register-submit');
      const status = document.getElementById('formStatus');
      status.textContent = '';
      status.className = 'form-status';

      if (!registerForm.checkValidity()) {
        registerForm.reportValidity();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = currentLang === 'ar' ? 'جارٍ الإرسال…' : 'Submitting…';

      try {
        const fd = new FormData(registerForm);
        const idFile = document.getElementById('idPhoto').files[0];
        const idPhotoDataUrl = idFile ? await resizeImageToDataUrl(idFile, 1600) : '';

        const payload = {
          firstName: fd.get('firstName'),
          lastName: fd.get('lastName'),
          idPhoto: idPhotoDataUrl,
          idPhotoName: idFile ? idFile.name.replace(/\.[^.]+$/, '') + '.jpg' : '',
          idPhotoType: 'image/jpeg',
          school: fd.get('school'),
          level: fd.get('level'),
          phone: fd.get('phone'),
          email: fd.get('email'),
          committee1: fd.get('committee1'),
          committee2: fd.get('committee2'),
          englishLevel: fd.get('englishLevel'),
          lunch: fd.get('lunch'),
          why: fd.get('why'),
          issue: fd.get('issue'),
          attendedBefore: fd.get('attendedBefore'),
        };

        const res = await fetch(FORM_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
        const result = await res.json();

        if (result.result === 'success') {
          registerForm.reset();
          status.textContent = currentLang === 'ar'
            ? "تم تسجيلك! سنتواصل معك قبل 21 نوفمبر."
            : "You're in. We'll be in touch closer to November 21.";
          status.className = 'form-status success';
        } else {
          throw new Error(result.message || 'Unknown error');
        }
      } catch (err) {
        status.textContent = currentLang === 'ar'
          ? "حدث خطأ أثناء إرسال طلبك. يرجى المحاولة مرة أخرى أو مراسلتنا مباشرة."
          : "Something went wrong submitting your application. Please try again, or email us directly.";
        status.className = 'form-status error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentLang === 'ar' ? 'إرسال الطلب' : 'Submit Application';
      }
    });
  }

  // Initial paint
  applyLang(currentLang);
</script>

</body>
</html>
